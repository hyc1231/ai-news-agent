name: CI

# 这套测试是**完全离线**的：tests/conftest.py 在导入业务模块之前就强制
# SQLite + 临时数据库、把外部密钥清空、关掉定时任务。所以这里不需要任何
# Secret，也不会调用 DeepSeek / Tavily，fork 出来的 PR 同样能跑通。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 跑离线测试
        run: pytest
